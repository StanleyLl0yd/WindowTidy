name: Release Windows x64

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Numerical version (for example 0.1.0)'
        required: true
        default: '0.1.0'
        type: string

permissions:
  contents: write
  issues: read

concurrency:
  group: window-tidy-release
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish Windows x64
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce release gates
        id: gate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version || '0.1.0' }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'Release workflow must be dispatched on main.'
          }
          if ($env:RELEASE_VERSION -cnotmatch '^\d+\.\d+\.\d+$') {
            throw 'Version must be numerical MAJOR.MINOR.PATCH with no suffix.'
          }
          $releaseTag = "v$env:RELEASE_VERSION"
          $knownReleases = @(& gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot check existing GitHub releases.' }
          if ($knownReleases -contains $releaseTag) {
            Write-Host "Release already exists: $releaseTag"
            "publish=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          $acceptanceState = (& gh issue view 2 --repo $env:GITHUB_REPOSITORY --json state --jq '.state')
          if ($LASTEXITCODE -ne 0 -or -not $acceptanceState) {
            throw 'Could not verify desktop acceptance issue #2.'
          }
          $acceptanceState = $acceptanceState.Trim()
          if ($acceptanceState -ne 'CLOSED') {
            # Owner explicitly requested a first downloadable release before GUI acceptance.
            # This exception is limited to the one-time main push for v0.1.0.
            if ($env:GITHUB_EVENT_NAME -ne 'push' -or $env:RELEASE_VERSION -ne '0.1.0') {
              throw 'Desktop acceptance #2 is still open; manual releases remain gated.'
            }
            Write-Warning 'v0.1.0 will be published with GUI acceptance explicitly marked pending.'
          }
          "publish=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Build and test
        if: steps.gate.outputs.publish == 'true'
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          call scripts\build.cmd test
          if errorlevel 1 exit /b 1
      - name: Verify portable executable and embedded manifest
        if: steps.gate.outputs.publish == 'true'
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -File scripts\verify_pe.ps1
          if errorlevel 1 exit /b 1
      - name: Verify approved icon and embedded icon group
        if: steps.gate.outputs.publish == 'true'
        shell: pwsh
        run: ./scripts/verify_icon.ps1
      - name: Smoke test application startup
        if: steps.gate.outputs.publish == 'true'
        shell: pwsh
        run: ./scripts/smoke_test.ps1
      - name: Prepare release checksums and notes
        if: steps.gate.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version || '0.1.0' }}
        run: |
          $digest = (Get-FileHash 'build/x64/WindowTidy.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $issueState = (& gh issue view 2 --repo $env:GITHUB_REPOSITORY --json state --jq '.state').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify GUI acceptance state for release notes.' }
          $acceptanceNote = if ($issueState -eq 'CLOSED') {
            'Interactive Windows 10/11 acceptance: completed in issue #2.'
          } else {
            'IMPORTANT: Interactive Windows 10/11 GUI acceptance is NOT complete (issue #2). This release is available for device testing; CI and smoke tests do not establish desktop compatibility.'
          }
          "$digest  WindowTidy.exe" | Set-Content 'build/x64/SHA256SUMS.txt' -Encoding Ascii
          @"
          Window Tidy v$env:RELEASE_VERSION is a portable unsigned Windows 10/11 x64 executable.

          This build includes the approved Window Tidy application icon in the executable and system tray.
          Windows CI completed MSVC compilation, native logic tests, shortcut collision integration test,
          runtime dependency and manifest verification, icon resource and checksum verification,
          and a process startup smoke test.

          No installer or additional runtime is needed. No third-party runtime dependencies.
          No code-signing certificate is provided.

          $acceptanceNote

          SHA-256 of WindowTidy.exe:
          $digest

          See README.md and docs/WINDOWS-ACCEPTANCE.md in the repository for usage and test coverage.
          "@ | Set-Content 'build/x64/RELEASE-NOTES.txt' -Encoding UTF8
      - name: Publish numbered GitHub Release
        if: steps.gate.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version || '0.1.0' }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          & gh release create $tag 'build/x64/WindowTidy.exe' 'build/x64/SHA256SUMS.txt' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Window Tidy $tag" `
            --notes-file 'build/x64/RELEASE-NOTES.txt' `
            --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }
