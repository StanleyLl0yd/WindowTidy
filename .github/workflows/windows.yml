name: Windows x64

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-build:
    name: Build and test MSVC x64
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          call scripts\build.cmd test
          if errorlevel 1 exit /b 1
      - name: Verify portable executable dependencies
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -File scripts\verify_pe.ps1
          if errorlevel 1 exit /b 1
      - name: SHA-256
        shell: pwsh
        run: |
          $digest = (Get-FileHash "build/x64/WindowTidy.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  WindowTidy.exe" | Set-Content "build/x64/SHA256SUMS.txt" -Encoding Ascii
          Get-Content "build/x64/SHA256SUMS.txt"
      - name: Publish unsigned Windows executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WindowTidy-Windows-x64
          path: |
            build/x64/WindowTidy.exe
            build/x64/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
