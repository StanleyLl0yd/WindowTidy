name: Release Windows x64

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Numeric MAJOR.MINOR.PATCH version'
        required: true
        default: '0.1.1'
        type: string
      acceptance:
        description: 'Full Windows 10/11 acceptance or documented limited device verification'
        required: true
        default: 'limited'
        type: choice
        options:
          - limited
          - full
  push:
    branches: [main]
    paths:
      - '.github/release-request.txt'

permissions:
  contents: write
  issues: read

concurrency:
  group: window-tidy-release
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish Windows x64
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce release gates
        id: gate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_ACCEPTANCE: ${{ inputs.acceptance }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'Release must run on main.'
          }

          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $request = @(Get-Content '.github/release-request.txt' -Encoding UTF8)
            if ($request.Count -ne 2 -or
                $request[0] -cnotmatch '^version=(\d+\.\d+\.\d+)$' -or
                $request[1] -cnotmatch '^acceptance=(full|limited)$') {
              throw 'Release request must contain exactly version=N.N.N and acceptance=full|limited.'
            }
            $version = $request[0].Substring('version='.Length)
            $acceptance = $request[1].Substring('acceptance='.Length)
          } elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $version = $env:REQUESTED_VERSION
            $acceptance = $env:REQUESTED_ACCEPTANCE
          } else {
            throw 'Unsupported release trigger.'
          }

          if ($version -cnotmatch '^\d+\.\d+\.\d+$') {
            throw 'Version must be numeric MAJOR.MINOR.PATCH without suffixes.'
          }
          if ($acceptance -cnotin @('limited', 'full')) {
            throw 'Acceptance must be explicitly limited or full.'
          }
          $tag = "v$version"
          $notesPath = "docs/releases/$tag.md"
          if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) {
            throw "Missing release-specific notes and acceptance record: $notesPath"
          }
          $notes = Get-Content -LiteralPath $notesPath -Raw -Encoding UTF8
          if (-not ($notes -cmatch "(?m)^Acceptance: $acceptance\s*$")) {
            throw "The release notes must explicitly record Acceptance: $acceptance."
          }

          $state = (& gh issue view 2 --repo $env:GITHUB_REPOSITORY --json state --jq '.state')
          if ($LASTEXITCODE -ne 0 -or -not $state) {
            throw 'Cannot check Windows 10/11 desktop acceptance issue #2.'
          }
          if ($acceptance -eq 'full' -and $state.Trim() -ne 'CLOSED') {
            throw 'Full acceptance requires documented Windows 10 and 11 results and a closed issue #2.'
          }
          # A limited release is permitted only with explicit, version-specific
          # evidence of owner verification; issue #2 stays open until both OS passes.
          if ($acceptance -eq 'limited' -and
              -not ($notes -match '(?i)owner.*verified|owner.*confirmed')) {
            throw 'Limited release needs an explicit owner-verification statement in its notes.'
          }

          $existing = @(& gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect existing releases.' }
          if ($existing -contains $tag) {
            Write-Host "Already published: $tag"
            'publish=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "acceptance=$acceptance" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          'publish=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Build and test
        if: steps.gate.outputs.publish == 'true'
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          call scripts\build.cmd test
          if errorlevel 1 exit /b 1
      - name: Verify portable executable and embedded manifest
        if: steps.gate.outputs.publish == 'true'
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -File scripts\verify_pe.ps1
          if errorlevel 1 exit /b 1
      - name: Verify approved icon and embedded icon group
        if: steps.gate.outputs.publish == 'true'
        shell: pwsh
        run: ./scripts/verify_icon.ps1
      - name: Smoke test application startup
        if: steps.gate.outputs.publish == 'true'
        shell: pwsh
        run: ./scripts/smoke_test.ps1
      - name: Prepare release checksums and notes
        if: steps.gate.outputs.publish == 'true'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.gate.outputs.version }}
          ACCEPTANCE: ${{ steps.gate.outputs.acceptance }}
        run: |
          $digest = (Get-FileHash 'build/x64/WindowTidy.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  WindowTidy.exe" | Set-Content 'build/x64/SHA256SUMS.txt' -Encoding Ascii
          $specific = Get-Content "docs/releases/v$env:RELEASE_VERSION.md" -Raw -Encoding UTF8
          $acceptanceNote = if ($env:ACCEPTANCE -eq 'limited') {
            'Acceptance is LIMITED: the owner verified the reported functionality on a real Windows desktop. Separate complete Windows 10 and Windows 11 A01-A21 acceptance is still open as issue #2.'
          } else {
            'Acceptance is FULL: consult issue #2 for hands-on Windows 10 and Windows 11 test results.'
          }
          @"
          Window Tidy v$env:RELEASE_VERSION is a portable unsigned Windows 10/11 x64 executable.

          $specific

          Build verification: MSVC C++20 compilation and static analysis, native tests,
          shortcut conflict and Settings lifecycle integration tests, PE/manifest,
          approved 10-size icon resources and process startup smoke test.

          $acceptanceNote

          No installer, extra runtime, telemetry or third-party libraries. No code signing.
          SHA-256 (WindowTidy.exe): $digest

          Source: https://github.com/$env:GITHUB_REPOSITORY/tree/$env:GITHUB_SHA
          "@ | Set-Content 'build/x64/RELEASE-NOTES.txt' -Encoding UTF8
      - name: Publish numbered GitHub Release
        if: steps.gate.outputs.publish == 'true'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.gate.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          & gh release create $tag 'build/x64/WindowTidy.exe' 'build/x64/SHA256SUMS.txt' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Window Tidy $tag" `
            --notes-file 'build/x64/RELEASE-NOTES.txt' `
            --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }
